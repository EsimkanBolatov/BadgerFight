version: '3.9'

services:
  app:
    image: 'sha256:dcd2cc0e011a55902c79252bafb2a2942bae97ec11212387764a405013a56284'
    container_name: appb
    expose:
      - '8002'
    ports:
      - '8002:8002'
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=96KILLERe
      - DB_URL=jdbc:postgresql://dbb:5432/badger_fight
    depends_on:
      - dbb
  dbb:
    image: 'postgres'
    container_name: dbb
    expose:
      - '5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=96KILLERe




